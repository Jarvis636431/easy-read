          <h1>城市公共图书馆延长开放时间</h1>
          <p>多座公共图书馆将在工作日延长晚间开放时间，为市民提供更灵活的阅读空间。</p>
          <p>新的安排覆盖普通阅览室、少儿阅读区和部分自习空间，具体时间以各馆公告为准。</p>
          <p>图书馆同时增加夜间值班人员，并调整线上预约系统，以降低高峰时段的排队时间。</p>
          <p>试运行结束后，管理部门将根据到馆人数、读者反馈和运营成本评估长期方案。</p>
          <p>部分社区图书馆也计划在后续阶段加入，并提供跨馆借还和活动预约服务。</p>
        </article>
